name: NEXUSPACE macOS

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    name: Build macOS Intel VST3
    runs-on: macos-15-intel
    timeout-minutes: 35

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      VST3SDK_COMMIT: "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96"

    steps:
      - name: Checkout reverb
        uses: actions/checkout@v5

      - name: Extract project package
        shell: bash
        run: |
          set -euo pipefail
          test -f reverb.zip
          rm -rf project
          mkdir project
          unzip -q -o reverb.zip -d project
          test -f project/CMakeLists.txt
          test -d project/Source/DSP
          test -d project/Source/Plugin
          test -f project/Tests/CMakeLists.txt
          test -f project/Resources/NEXUSPACE.uidesc
          if grep -Rni --exclude-dir=Design --exclude='*.md' 'JUCE' project/Source project/CMakeLists.txt; then
            echo "JUCE reference found in active source/build files. Steinberg-only rule violated."
            exit 1
          fi
          if grep -RniE 'Steinberg::k(LittleEndian|BigEndian)|Steinberg::Vst::IPlugView' project/Source/Plugin; then
            echo "Stale/invalid Steinberg API spellings found in project package."
            exit 1
          fi
          echo "Project package extracted; active code is JUCE-free"

      - name: Fetch Steinberg VST3 SDK 3.8.1
        shell: bash
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/vst3sdk"
          rm -rf "$SDK"
          git init "$SDK"
          cd "$SDK"
          git remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git fetch --depth 1 origin "$VST3SDK_COMMIT"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          test "$(git rev-parse HEAD)" = "$VST3SDK_COMMIT"
          grep -q 'VERSION 3.8.1' CMakeLists.txt

      - name: Configure NEXUSPACE Steinberg VST3
        shell: bash
        run: |
          cmake -S project -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"

      - name: Syntax-check NEXUSPACE sources first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys

          db_path = pathlib.Path("build/compile_commands.json")
          if not db_path.is_file():
              raise SystemExit("compile_commands.json was not generated")

          commands = json.loads(db_path.read_text())
          selected = []
          for entry in commands:
              src = pathlib.Path(entry.get("file", ""))
              s = str(src)
              if "/project/Source/Plugin/" in s or s.endswith("/project/Source/DSP/NxReverbEngine.cpp"):
                  selected.append(entry)

          if not selected:
              raise SystemExit("No NEXUSPACE source compile commands found")

          print(f"Syntax-checking {len(selected)} NEXUSPACE translation units before SDK build...")
          for entry in selected:
              if "arguments" in entry:
                  args = list(entry["arguments"])
              else:
                  args = shlex.split(entry["command"])

              out = []
              skip = False
              for i, arg in enumerate(args):
                  if skip:
                      skip = False
                      continue
                  if arg == "-c":
                      continue
                  if arg == "-o":
                      skip = True
                      continue
                  out.append(arg)
              out.append("-fsyntax-only")

              print("CHECK", entry["file"])
              subprocess.run(out, cwd=entry["directory"], check=True)
          PY

      - name: Configure DSP tests
        shell: bash
        run: |
          cmake -S project/Tests -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build DSP tests
        shell: bash
        run: cmake --build build-tests --config Release --parallel 4

      - name: Run DSP tests
        shell: bash
        run: ctest --test-dir build-tests -C Release --output-on-failure

      - name: Build NEXUSPACE VST3
        shell: bash
        run: cmake --build build --config Release --target NEXUSPACE --parallel 4

      - name: Verify Intel VST3 binary
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="$(find build -type d -name 'NEXUSPACE.vst3' -print -quit)"
          if [ -z "$PLUGIN" ]; then
            echo "NEXUSPACE.vst3 was not produced"
            exit 1
          fi
          BIN="$PLUGIN/Contents/MacOS/NEXUSPACE"
          test -f "$BIN"
          file "$BIN"
          file "$BIN" | grep -q 'x86_64'
          echo "--- minimum macOS load command ---"
          otool -l "$BIN" | grep -A5 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true
          echo "PLUGIN_PATH=$PLUGIN" >> "$GITHUB_ENV"

      - name: Package constant build artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f NEXUSPACE-macOS.zip NEXUSPACE-macOS.sha256
          ditto -c -k --sequesterRsrc --keepParent "$PLUGIN_PATH" NEXUSPACE-macOS.zip
          shasum -a 256 NEXUSPACE-macOS.zip > NEXUSPACE-macOS.sha256

      - name: Upload NEXUSPACE macOS build
        uses: actions/upload-artifact@v4
        with:
          name: NEXUSPACE-macOS
          path: |
            NEXUSPACE-macOS.zip
            NEXUSPACE-macOS.sha256
          if-no-files-found: error
          compression-level: 0
